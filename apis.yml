name: Recommind
description: 'Recommind was an enterprise information analytics and eDiscovery software
  company founded in 2000, best known for its CORE predictive-analytics platform and
  its Axcelerate eDiscovery and information-governance products used by legal and enterprise
  customers. OpenText acquired Recommind in 2016, and the Recommind brand and its technology
  are now folded into OpenText''s Discovery and information-management portfolio. The
  standalone recommind.com domain now redirects to the OpenText brand page, and no
  independent Recommind developer portal, API reference, or API surface remains.'
